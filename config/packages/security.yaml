security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_usuario_provider:
            entity:
                class: App\Entity\Usuario
                property: username
        app_in_memory_provider:
            memory:
                users:
                    master-cli:
                        roles: ['ROLE_ADMIN', 'ROLE_SUPER_ADMIN']
                        password: '' # Sem senha, pois usamos JWT
    
        app_chained_provider:
            chain:
                providers: [app_in_memory_provider, app_usuario_provider]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/v1/auth/login
            stateless: true
            provider: app_chained_provider
            json_login:
                check_path: /api/v1/auth/login
                username_path: username
                password_path: senha
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

        refresh:
            pattern: ^/api/v1/token/refresh
            stateless: true
            provider: app_chained_provider
            refresh_jwt:
                check_path: /api/v1/token/refresh

        api:
            pattern: ^/api
            stateless: true
            provider: app_chained_provider
            jwt: ~

        main:
            lazy: true
            provider: app_usuario_provider

    access_control:
        - { path: ^/api/v1/health,          roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/login,      roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/registro,   roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/token/refresh,   roles: PUBLIC_ACCESS }
        - { path: ^/api,                    roles: IS_AUTHENTICATED_FULLY }
